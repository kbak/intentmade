name: openhands-factory
services:
  canvas:
    image: ${FACTORY_IMAGE:-openhands-factory:dev}
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:${CANVAS_PORT:-8000}:8000"]
    environment:
      FACTORY_IMAGE: ${FACTORY_IMAGE:-openhands-factory:dev}
      AGENT_SERVER_URL: http://127.0.0.1:8000
      DO_NOT_TRACK: "1"
      OH_PERSISTENCE_DIR: /home/openhands/.openhands
      AUTOMATION_BASE_URL: http://canvas:8000
      AUTOMATION_MAX_RUN_DURATION: "7200"
      DOCKER_HOST: unix:///run/factory-docker/docker.sock
    group_add: ["2375"]
    security_opt:
      - seccomp=./runtime/codex-seccomp.json
    volumes:
      - canvas-state:/home/openhands/.openhands
      - sandbox-control:/run/factory-docker
      - ${FACTORY_DATA_DIR:?Set FACTORY_DATA_DIR in .env}/catalog:/projects/repos:ro
      - ${FACTORY_DATA_DIR:?Set FACTORY_DATA_DIR in .env}/requests:/projects/requests
      - ${FACTORY_DATA_DIR:?Set FACTORY_DATA_DIR in .env}/artifacts:/projects/artifacts
      - ${FACTORY_DATA_DIR:?Set FACTORY_DATA_DIR in .env}/workspaces:/workspaces
      - ${FACTORY_CONFIG_DIR:?Set FACTORY_CONFIG_DIR in .env}:/opt/factory/config:ro
      - ./coordinator/AGENTS.md:/projects/AGENTS.md:ro
      - ${FACTORY_DATA_DIR:?Set FACTORY_DATA_DIR in .env}/secrets/canvas-key:/run/secrets/canvas-key:ro
      - ${FACTORY_DATA_DIR:?Set FACTORY_DATA_DIR in .env}/secrets/encryption-key:/run/secrets/encryption-key:ro
    mem_limit: 6g
    cpus: 4
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/canvas')"]
      interval: 10s
      timeout: 5s
      retries: 30
  sandboxes:
    image: docker:29.4.1-dind
    privileged: true
    restart: unless-stopped
    environment: {DOCKER_TLS_CERTDIR: ""}
    entrypoint: [sh, /opt/factory/sandbox-daemon]
    command: [dockerd, --host=unix:///run/factory-docker/docker.sock, --host=unix:///var/run/docker.sock, --group=2375, --storage-driver=overlay2]
    volumes:
      - sandbox-images:/var/lib/docker
      - sandbox-control:/run/factory-docker
      - ./runtime/sandbox-daemon:/opt/factory/sandbox-daemon:ro
      - ${FACTORY_DATA_DIR:?Set FACTORY_DATA_DIR in .env}/workspaces:/workspaces
      - ${FACTORY_PROFILES_DIR:?Set FACTORY_PROFILES_DIR in .env}:/profiles:ro
    mem_limit: 18g
    cpus: 10
    healthcheck:
      test: [CMD-SHELL, "test -f /run/factory-network-ready && docker info >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  canvas-state:
  sandbox-images:
  sandbox-control:
