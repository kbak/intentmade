name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          # Use upstream rules even if a candidate adds its own config/ignore file.
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          mkdir "$RUNNER_TEMP/gitleaks-ignore"
      - name: Verify detection, then scan full reachable history
        shell: bash
        run: |
          scanner=("$RUNNER_TEMP/gitleaks" --config "$RUNNER_TEMP/gitleaks.toml" --redact --no-banner --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-ignore")
          status=0
          # Synthetic, never issued; split the prefix so it is not a repo finding.
          printf 'token = "ghp_%s"\n' '7Js9aP2mQ4nR6tV8wX0yZ1bC3dE5fG7hJ9kL' |
            "${scanner[@]}" stdin --exit-code 42 || status=$?
          if [ "$status" -ne 42 ]; then
            echo "Secret scanner failed its detection self-check (exit $status)." >&2
            exit 1
          fi
          "${scanner[@]}" git --log-opts="--all" --verbose .
