name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use the security reporting link instead. Remove credentials and private project data from examples and logs."
  - type: textarea
    id: problem
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal example and the command or workflow you ran.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Include the commit or release, operating system, and relevant tool versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or evidence
      description: Include only the information needed to reproduce the problem.
